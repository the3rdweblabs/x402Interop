# [native]
#
# Local production-shaped PostgreSQL for the facilitator.
# Values come from apps/facilitator/.env.
#
#   docker compose --env-file apps/facilitator/.env up -d --wait
#   docker compose --env-file apps/facilitator/.env exec postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
#
# Port 5433 is deliberate: other projects may already own 5432.

name: x402interop

services:
  postgres:
    image: postgres:16-alpine
    container_name: x402interop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-x402interop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-x402interop}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - x402interop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Optional HTTP/2 + HTTP/3 edge. Start with:
  #   docker compose --profile proxy up -d
  # Backends stay HTTP/1.1 behind Caddy.
  proxy:
    image: caddy:2-alpine
    container_name: x402interop-proxy
    profiles: ['proxy']
    restart: unless-stopped
    ports:
      - '8443:8443'
      - '8443:8443/udp'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - x402interop-caddy-data:/data
      - x402interop-caddy-config:/config

volumes:
  x402interop-postgres-data:
  x402interop-caddy-data:
  x402interop-caddy-config:
